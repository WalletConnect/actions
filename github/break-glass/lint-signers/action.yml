name: Break-Glass Lint Signers
description: >-
  Checks a break-glass signers file: every non-comment line is a valid
  allowed_signers entry whose principals are exact logins, not patterns, and
  whose key is an `sk-` (FIDO2) type that parses with ssh-keygen. Run it on
  pull requests that touch the file.

inputs:
  signers-file:
    description: allowed_signers file to check
    required: false
    default: .github/break-glass-signers

runs:
  using: composite
  steps:
    - shell: bash
      env:
        SIGNERS: ${{ inputs.signers-file }}
      run: python3 "$GITHUB_ACTION_PATH/lint.py" "$SIGNERS"
