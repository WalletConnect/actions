name: Break-Glass Verify Proof
description: >-
  Verifies that the person who dispatched the run holds an enrolled FIDO2
  (YubiKey) SSH key, and returns what they signed. The `proof` dispatch input,
  made by break-glass-sign.py, is JSON: a payload (a JSON object, as a string)
  and an `ssh-keygen -Y` signature over its exact bytes in the `break-glass`
  namespace. The signer must be the dispatcher (`github.actor`), listed in the
  repository's signers file, with an `sk-` key, and the signature must carry
  the device's touch flag. The payload's `aud` must be this
  repository and its `iat` recent; every other field is the calling
  repository's to define and check. The run must be on the default branch,
  and the signers file is read from that branch through the API, not from the
  checkout, so neither rule depends on the calling workflow.

inputs:
  proof:
    description: The proof from break-glass-sign.py, as passed in the dispatch input
    required: true
  signers-file:
    description: Path of the allowed_signers file in the repository (read from the default branch); principal = GitHub login, keys must be sk- types
    required: false
    default: .github/break-glass-signers
  token:
    description: Token with contents:read, to read the signers file from the default branch
    required: false
    default: ${{ github.token }}
  max-age:
    description: Seconds a proof stays valid after its iat
    required: false
    default: '600'

outputs:
  payload:
    description: >-
      The verified payload as compact JSON, e.g. {"aud":…,"iat":…,"image_tag":…}.
      Read fields with fromJSON(steps.<id>.outputs.payload).<field>, and hand them to
      scripts through env:, not ${{ }} inside run:.
    value: ${{ steps.verify.outputs.payload }}
  signer:
    description: Login whose key verified the proof (always the dispatcher)
    value: ${{ steps.verify.outputs.signer }}
  key-type:
    description: SSH key type of the verifying key
    value: ${{ steps.verify.outputs.key-type }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token }}
        REPO: ${{ github.repository }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        ACTOR: ${{ github.actor }}
        TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        PROOF: ${{ inputs.proof }}
        SIGNERS_PATH: ${{ inputs.signers-file }}
        MAX_AGE: ${{ inputs.max-age }}
      run: python3 "$GITHUB_ACTION_PATH/verify.py"
