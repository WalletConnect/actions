name: Break-Glass Verify Proof
description: >-
  Verifies that the person who dispatched the run holds an enrolled FIDO2
  (YubiKey) SSH key: an `ssh-keygen -Y` signature, in the `break-glass`
  namespace, over the challenge the run computed, passed as the dispatch
  input `proof` by break-glass-sign.sh. The signer must be the dispatcher
  (`github.actor`), listed in the repository's signers file, and the key must
  be an `sk-` type, which cannot sign without the device being touched. Needs
  the repository checked out (the signers file comes from main).

inputs:
  message:
    description: The challenge text computed by the run, e.g. break-glass:<repo>:pr:<n>:<sha>
    required: true
  proof:
    description: SSH signature over `message` (the PEM block, or its base64), from the dispatch input
    required: true
  signers-file:
    description: allowed_signers file; principal = GitHub login, keys must be sk- types
    required: false
    default: .github/break-glass-signers
  namespace:
    description: Signature namespace
    required: false
    default: break-glass

outputs:
  signer:
    description: Login whose key verified the proof (always the dispatcher)
    value: ${{ steps.verify.outputs.signer }}
  key-type:
    description: SSH key type of the verifying key
    value: ${{ steps.verify.outputs.key-type }}

runs:
  using: composite
  steps:
    - id: verify
      shell: bash
      env:
        REPO: ${{ github.repository }}
        ACTOR: ${{ github.actor }}
        MESSAGE: ${{ inputs.message }}
        PROOF: ${{ inputs.proof }}
        SIGNERS: ${{ inputs.signers-file }}
        NAMESPACE: ${{ inputs.namespace }}
      run: |
        set -euo pipefail
        [ -f "$SIGNERS" ] || { echo "::error::signers file $SIGNERS not found; enrol keys first (see github/break-glass/README.md)"; exit 1; }
        HINT="is @$ACTOR's sk- key in $SIGNERS with principal '$ACTOR' (case-sensitive) and namespace '$NAMESPACE'?"
        if [ -z "$PROOF" ]; then
          echo "::error::no proof: dispatch with break-glass-sign.sh, which signs the challenge on your YubiKey and passes it as the 'proof' input. Dispatching from the Actions page is not supported."; exit 1
        fi
        work=$(mktemp -d)
        printf '%s' "$MESSAGE" > "$work/msg"

        # Key type of the key embedded in an SSH signature (SSHSIG wire format).
        key_type() {
          python3 - "$1" <<'PY'
        import base64, struct, sys
        pem = open(sys.argv[1]).read().split("-----")[2]
        blob = base64.b64decode("".join(pem.split()))
        assert blob[:6] == b"SSHSIG", "not an SSH signature"
        off = 10                                   # magic(6) + version(4)
        (klen,) = struct.unpack(">I", blob[off:off+4]); key = blob[off+4:off+4+klen]
        (tlen,) = struct.unpack(">I", key[:4]); print(key[4:4+tlen].decode())
        PY
        }
        # Verify one PEM signature file against the message; prints the key type on success.
        verify() {
          ssh-keygen -Y verify -f "$SIGNERS" -I "$ACTOR" -n "$NAMESPACE" -s "$1" < "$work/msg" >/dev/null 2>&1 || return 1
          local kt; kt=$(key_type "$1")
          case "$kt" in
            sk-ssh-ed25519@openssh.com|sk-ecdsa-sha2-nistp256@openssh.com) echo "$kt" ;;
            *) echo "::error::proof verified but with a non-FIDO2 key ($kt); only sk- keys are accepted" >&2; return 1 ;;
          esac
        }
        extract_sig() { awk '/-----BEGIN SSH SIGNATURE-----/,/-----END SSH SIGNATURE-----/' ; }

        if grep -q 'BEGIN SSH SIGNATURE' <<< "$PROOF"; then extract_sig <<< "$PROOF" > "$work/sig.pem"
        else base64 -d <<< "$PROOF" > "$work/sig.pem"; fi
        kt=$(verify "$work/sig.pem") || { echo "::error::the proof passed at dispatch does not verify for @$ACTOR over '$MESSAGE'; $HINT"; exit 1; }
        echo "proof verified: @$ACTOR signed '$MESSAGE' with a $kt key"
        { echo "signer=$ACTOR"; echo "key-type=$kt"; } >> "$GITHUB_OUTPUT"
        echo "- 🔐 Proof: @$ACTOR, \`$kt\`, over \`$MESSAGE\`" >> "$GITHUB_STEP_SUMMARY"
