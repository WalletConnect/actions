name: 📊 Maestro E2E KPIs (aggregate + post to Slack)

on:
  schedule:
    - cron: '0 9 * * *'  # 09:00 UTC daily
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maestro-kpi-aggregate
  cancel-in-progress: false

jobs:
  aggregate:
    name: Compute KPIs and post to Slack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Cross-org read across the 5 tracked SDK / backend repos.
      GH_TOKEN: ${{ secrets.KPI_GITHUB_PAT }}
      SLACK_KPI_WEBHOOK_URL: ${{ secrets.SLACK_KPI_WEBHOOK_URL }}
    steps:
      # Actions pinned to commit SHA (not @vN tag) — this workflow holds a
      # cross-org PAT, so a hijacked/force-pushed action tag would have
      # high blast radius. Other workflows in this repo use tags; bump
      # this one when the actions release a meaningful new version.
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5

      - name: Validate secrets
        run: |
          set -euo pipefail
          missing=()
          [[ -z "${GH_TOKEN:-}" ]] && missing+=("KPI_GITHUB_PAT")
          [[ -z "${SLACK_KPI_WEBHOOK_URL:-}" ]] && missing+=("SLACK_KPI_WEBHOOK_URL")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required secrets: ${missing[*]}"
            exit 1
          fi
          gh auth status 2>&1 | head -5

      # Resolve the previous completed report explicitly. download-artifact
      # defaults to the current run, which cannot contain yesterday's state.
      - name: Find previous successful KPI report
        id: previous
        run: |
          set -euo pipefail
          run_id=$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/maestro-kpi-aggregate.yml/runs?status=success&per_page=1" \
            --jq '.workflow_runs[0].id // empty')
          if [[ -n "$run_id" ]]; then
            echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          fi

      # Retrieve the previous pass rates + active alert state. Best-effort:
      # the first run after deployment has pass.jsonl only, and the very first
      # report has no prior artifact at all.
      - name: Download previous KPI state (best-effort)
        if: steps.previous.outputs.run_id != ''
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4
        with:
          name: kpi-pass-rate-latest
          path: previous/
          github-token: ${{ secrets.KPI_GITHUB_PAT }}
          run-id: ${{ steps.previous.outputs.run_id }}

      - name: Compute pass rate (7d, main)
        run: bash metrics/scripts/kpi_pass_rate.sh > pass.jsonl

      - name: Compute flake rate (7d)
        run: bash metrics/scripts/kpi_flake_rate.sh > flake.jsonl

      - name: Compute P95 feedback (7d, PR)
        run: bash metrics/scripts/kpi_p95_feedback.sh > p95.jsonl

      # Bug-catches KPI (kpi_bug_catches.sh) is kept in-tree for a later
      # iteration but not rendered in Slack yet — the heuristic produces
      # numbers that are too noisy to act on without more analysis.

      - name: Echo computed KPIs (for run-log debuggability)
        run: |
          echo "--- pass.jsonl ---"; cat pass.jsonl
          echo "--- flake.jsonl ---"; cat flake.jsonl
          echo "--- p95.jsonl ---";  cat p95.jsonl

      - name: Post to Slack
        env:
          PASS_FILE: pass.jsonl
          FLAKE_FILE: flake.jsonl
          P95_FILE: p95.jsonl
          YESTERDAY_PASS: previous/pass.jsonl
          PREVIOUS_ALERT_STATE: previous/alert-state.jsonl
          ALERT_STATE_FILE: alert-state.jsonl
        run: bash metrics/scripts/post_to_slack.sh

      # Persist today's pass rates and active breach state. The next report
      # uses them for the 2-day pass-rate rule and to avoid repeating an alert
      # until that metric first recovers and breaches again.
      - name: Upload today's KPI state
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: kpi-pass-rate-latest
          path: |
            pass.jsonl
            alert-state.jsonl
          retention-days: 7
          overwrite: true
