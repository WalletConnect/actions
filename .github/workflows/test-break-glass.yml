name: Test Break-Glass

on:
  push:
    paths:
      - "github/break-glass/**"
      - ".github/workflows/test-break-glass.yml"
  pull_request:
    paths:
      - "github/break-glass/**"
      - ".github/workflows/test-break-glass.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sign and verify proofs
        run: github/break-glass/test.sh
