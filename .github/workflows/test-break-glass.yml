name: Test Break-Glass

on:
  push:
    paths:
      - "github/break-glass/**"
      - ".github/workflows/test-break-glass.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      matrix:
        python-version: ["3.9", "3.x"]   # 3.9: macOS's system python3, the oldest supported
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Test the helper, verify-proof and lint-signers
        run: python -m unittest discover -s github/break-glass/tests -v
