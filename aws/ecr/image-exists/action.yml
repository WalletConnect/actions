name: ECR Image Exists
description: >-
  Reports whether an image tag exists in an ECR repository, so a pipeline can
  skip a build whose image was already published (for example a PR image
  published by CI). AWS credentials must be configured by the caller.

inputs:
  repository:
    description: ECR repository name
    required: true
  tag:
    description: Image tag to look up
    required: true
  region:
    description: AWS region; defaults to the configured AWS_REGION
    required: false
    default: ''
  registry-id:
    description: AWS account id of the registry; defaults to the caller's account
    required: false
    default: ''

outputs:
  exists:
    description: "true or false"
    value: ${{ steps.lookup.outputs.exists }}
  digest:
    description: Image digest when it exists
    value: ${{ steps.lookup.outputs.digest }}
  pushed-at:
    description: Push timestamp when it exists
    value: ${{ steps.lookup.outputs.pushed-at }}

runs:
  using: composite
  steps:
    - id: lookup
      shell: bash
      env:
        REPOSITORY: ${{ inputs.repository }}
        TAG: ${{ inputs.tag }}
        REGION: ${{ inputs.region }}
        REGISTRY_ID: ${{ inputs.registry-id }}
      run: |
        set -euo pipefail
        args=(--repository-name "$REPOSITORY" --image-ids "imageTag=$TAG" --output json)
        [ -n "$REGION" ] && args+=(--region "$REGION")
        [ -n "$REGISTRY_ID" ] && args+=(--registry-id "$REGISTRY_ID")

        if out=$(aws ecr describe-images "${args[@]}" 2>&1); then
          echo "$REPOSITORY:$TAG exists"
          {
            echo "exists=true"
            echo "digest=$(jq -r '.imageDetails[0].imageDigest' <<< "$out")"
            echo "pushed-at=$(jq -r '.imageDetails[0].imagePushedAt' <<< "$out")"
          } >> "$GITHUB_OUTPUT"
        elif grep -q ImageNotFoundException <<< "$out"; then
          echo "$REPOSITORY:$TAG does not exist"
          { echo "exists=false"; echo "digest="; echo "pushed-at="; } >> "$GITHUB_OUTPUT"
        else
          # Any other error (auth, missing repository, throttling) must not read as "not found".
          echo "$out"
          echo "::error::describe-images failed for $REPOSITORY:$TAG"; exit 1
        fi
