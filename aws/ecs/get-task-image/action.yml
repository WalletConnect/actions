name: 'Deploy Image to ECS'
description: 'Deploys a new revision of an App to ECS'

inputs:
  aws-role-arn:
    description: 'the ARN of the AWS role to assume'
    required: true
  aws-region:
    description: 'The AWS region to deploy to'
    required: true
  task-definition-name:
    description: 'The name of the ECS task definition'
    required: true
  container-name:
    description: 'The name of the container in the task definition.'
    required: true

outputs:
  registry:
    description: 'The ECR registry name'
    value: ${{ steps.get-task.outputs.registry }}
  image:
    description: 'The image name'
    value: ${{ steps.get-task.outputs.image }}
  tag:
    description: 'The image tag'
    value: ${{ steps.get-task.outputs.tag }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        role-to-assume: ${{ inputs.aws-role-arn }}
        aws-region: ${{ inputs.aws-region }}

    - name: Get task definition
      id: get-task
      shell: bash
      run: |
        FAMILY='${{ inputs.task-definition-name }}'
        # The revision the service runs, not the family's newest ACTIVE one:
        # an apply that deregistered the running revision and failed before
        # registering its replacement leaves an old revision newest, and
        # reading the family would hand that old image back as "deployed".
        # The primary deployment of the service running this family; the
        # family's newest revision only if no service runs it.
        TASK_DEFINITION=$(
          for CLUSTER in $(aws ecs list-clusters --query 'clusterArns[]' --output text); do
            SERVICES=$(aws ecs list-services --cluster "$CLUSTER" --query 'serviceArns[]' --output text)
            [ -n "$SERVICES" ] || continue
            printf '%s\n' $SERVICES | xargs -n 10 aws ecs describe-services --cluster "$CLUSTER" \
              --query 'services[].deployments[?status==`PRIMARY`].taskDefinition[]' --output text --services
          done | tr '\t' '\n' | grep -E ":task-definition/${FAMILY}:[0-9]+$" | head -1
        )
        if [ -z "$TASK_DEFINITION" ]; then
          echo "No service runs family $FAMILY; reading the family's newest revision"
          TASK_DEFINITION=$FAMILY
        fi
        echo "Task definition: $TASK_DEFINITION"
        TASK_ARN=$(aws ecs describe-task-definition --task-definition "$TASK_DEFINITION" --query taskDefinition | jq -r '.containerDefinitions[] | select(.name == "${{ inputs.container-name }}") | .image')
        ARN_PARTS=($(echo $TASK_ARN | tr '\/' "\n"))
        REGISTRY_NAME=${ARN_PARTS[0]}
        IMAGE_VERSION=${ARN_PARTS[1]}

        IMAGE_PARTS=($(echo $IMAGE_VERSION | tr ':' "\n"))
        IMAGE_NAME=${IMAGE_PARTS[0]}
        IMAGE_TAG=${IMAGE_PARTS[1]}

        echo "Found task definition with arn $TASK_ARN"
        echo "Registry name is $REGISTRY_NAME"
        echo "Image name is $IMAGE_NAME"
        echo "Image tag is $IMAGE_TAG"

        echo "registry=$REGISTRY_NAME" >> $GITHUB_OUTPUT
        echo "image=$IMAGE_NAME" >> $GITHUB_OUTPUT
        echo "tag=$IMAGE_TAG" >> $GITHUB_OUTPUT
