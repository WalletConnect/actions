name: Maestro Setup
description: Install the Maestro CLI for mobile E2E testing

inputs:
  version:
    description: 'Maestro version to install (e.g. 1.39.15). Leave empty for latest.'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install Maestro CLI
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if command -v maestro &>/dev/null; then
          echo "Maestro already installed: $(maestro --version)"
          exit 0
        fi

        if [ -n "$VERSION" ]; then
          export MAESTRO_VERSION="$VERSION"
        fi

        curl -fsSL "https://get.maestro.mobile.dev" | bash

        # The installer can exit 0 without installing (e.g. a corrupt download).
        installed="$("$HOME/.maestro/bin/maestro" --version 2>/dev/null | tail -n 1 | tr -d '[:space:]' || true)"
        if [ -z "$installed" ]; then
          echo "::error::Maestro${VERSION:+ $VERSION} was not installed"
          exit 1
        fi
        if [ -n "$VERSION" ] && [ "$installed" != "$VERSION" ]; then
          echo "::error::Installed Maestro $installed, expected $VERSION"
          exit 1
        fi
        echo "Maestro installed: $installed"
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
